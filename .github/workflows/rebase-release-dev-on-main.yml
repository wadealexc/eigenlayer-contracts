name: Rebase release-dev/* onto main

on:
  schedule:
    - cron: "0 20 * * *"  # Runs at 8pm UTC daily
  workflow_dispatch:

jobs:
  rebase-release-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Fetch all remote branches
        run: |
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Rebase each release-dev/* branch onto main
        run: |
          for branch in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/release-dev/*); do
            echo "Processing $branch"
            bname=$(basename $branch)

            # Checkout from the remote branch
            git checkout -B $bname $branch

            # Rebase onto origin/main
            if git rebase origin/main; then
              git push origin $bname
              echo "✅ Successfully rebased and pushed $bname"
            else
              echo "⚠️ Rebase failed for $bname, skipping push"
              git rebase --abort || true
            fi

            # Delete local temp branch
            git checkout main || git checkout -
            git branch -D $bname || true
          done
